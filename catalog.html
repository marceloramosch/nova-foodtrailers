<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Food Trailers - Catalogo y Blueprints</title>
<style>
  :root{
    --blue: #2D6BC4;
    --dark: #0D2244;
    --silver: #C8D8F0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family: Arial, sans-serif;
    background: #f4f7fc;
    color: var(--dark);
  }
  header{
    background: #ffffff;
    border-bottom: 3px solid var(--blue);
    padding: 18px 24px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  header .trailer-icon{ width:48px; height:48px; flex-shrink:0; }
  header .brand-text h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    letter-spacing: 4px;
    color: var(--dark);
  }
  header .brand-text p{
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 6px;
    color: var(--blue);
    font-weight: 700;
  }

  main{ max-width: 1100px; margin: 0 auto; padding: 24px; }

  .size-picker{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;
  }
  .size-picker button{
    border: 2px solid var(--blue);
    background: #fff;
    color: var(--blue);
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all .15s;
  }
  .size-picker button.active,
  .size-picker button:hover{
    background: var(--blue);
    color: #fff;
  }

  .view-tabs{
    display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;
  }
  .view-tabs button{
    border: 1px solid var(--blue);
    background: #eef3fc;
    color: var(--blue);
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 12.5px;
    transition: all .15s;
  }
  .view-tabs button.active,
  .view-tabs button:hover{
    background: var(--blue);
    color: #fff;
  }

  .layout{
    display:grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 24px;
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
  }

  .panel{
    background:#fff;
    border: 1px solid var(--silver);
    border-radius: 10px;
    padding: 18px;
  }

  .blueprint-panel svg{ width:100%; height:auto; display:block; }

  .price-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--silver);
    padding-bottom: 12px;
  }
  .price-row .price{ font-size: 28px; font-weight:800; color:var(--blue); }
  .price-row .label{ font-size: 16px; font-weight:700; color:var(--dark); }

  h2{ font-size:15px; letter-spacing:1px; color:var(--blue); margin: 14px 0 8px; text-transform: uppercase; }

  ul.equip-list{ list-style:none; }
  ul.equip-list li{
    display:flex; gap:8px; padding: 4px 0; font-size: 13.5px; align-items:flex-start;
  }
  ul.equip-list li .num{
    background: var(--blue); color:#fff; font-weight:700; font-size:11px;
    width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  ul.specs-list{ list-style:none; }
  ul.specs-list li{ font-size: 13px; padding: 3px 0; }
  ul.specs-list li::before{ content:"\2022 "; color: var(--blue); font-weight:700; }

  footer{
    text-align:center; padding: 24px; font-size:12px; color:#5b6b8c;
    border-top:1px solid var(--silver); margin-top: 24px;
  }
  footer b{ color:var(--dark); }
</style>
</head>
<body>

<header>
  <svg class="trailer-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect x="6" y="18" width="48" height="24" rx="2" fill="#2D6BC4"/>
    <rect x="10" y="22" width="16" height="10" fill="#C8D8F0"/>
    <rect x="30" y="22" width="18" height="16" fill="#0D2244"/>
    <circle cx="20" cy="46" r="6" fill="#0D2244"/>
    <circle cx="44" cy="46" r="6" fill="#0D2244"/>
    <circle cx="20" cy="46" r="2.4" fill="#C8D8F0"/>
    <circle cx="44" cy="46" r="2.4" fill="#C8D8F0"/>
    <path d="M52 26 l4 4 l-2 2 l-4 -4 z" fill="#C8D8F0"/>
  </svg>
  <div class="brand-text">
    <h1>NOVA</h1>
    <p>F O O D&nbsp;&nbsp;&nbsp;T R A I L E R</p>
  </div>
  <nav style="margin-left:auto; display:flex; gap:10px;">
    <a href="index.html" style="color:var(--blue); font-weight:700; font-size:13px; text-decoration:none; border:2px solid var(--blue); border-radius:6px; padding:6px 12px;">Catalogo</a>
    <a href="cotizador.html" style="color:var(--blue); font-weight:700; font-size:13px; text-decoration:none; border:2px solid var(--blue); border-radius:6px; padding:6px 12px;">Cotizador</a>
  </nav>
</header>

<main>
  <div class="size-picker" id="sizePicker"></div>

  <div class="layout">
    <div>
      <div class="view-tabs" id="viewTabs"></div>
      <div class="panel blueprint-panel" id="blueprintPanel"></div>
    </div>

    <div class="panel">
      <div class="price-row">
        <span class="label" id="sizeLabel"></span>
        <span class="price" id="sizePrice"></span>
      </div>

      <h2>Equipo incluido</h2>
      <ul class="equip-list" id="equipList"></ul>

      <h2>Especificaciones</h2>
      <ul class="specs-list" id="specsList"></ul>
    </div>
  </div>
</main>

<footer>
  <b>Nova Food Trailers</b> &middot; Marcelo Ramos Schiaffino &middot; +1 (645) 235-3186 &middot; marceloramosch@gmail.com
</footer>

<script src="data/trailers.js"></script>
<script src="blueprint.js"></script>
<script src="app.js"></script>
</body>
</html>
