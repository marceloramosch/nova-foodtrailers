<defs>
  <!-- wall cross-hatch -->
  <pattern id="wall" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="7" height="7" fill="#e9ecef"/>
    <line x1="0" y1="0" x2="0" y2="7" stroke="#2b2b2b" stroke-width="1.1"/>
  </pattern>
  <!-- tire radial -->
  <radialGradient id="tire" cx="38%" cy="35%" r="70%">
    <stop offset="0%" stop-color="#eef1f5"/>
    <stop offset="55%" stop-color="#c4cad2"/>
    <stop offset="100%" stop-color="#9aa1ab"/>
  </radialGradient>
  <radialGradient id="rim" cx="40%" cy="38%" r="65%">
    <stop offset="0%" stop-color="#f4f6f9"/>
    <stop offset="100%" stop-color="#b6bcc4"/>
  </radialGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a3a3a"/>
    <stop offset="100%" stop-color="#1c1c1c"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#777"/>
    <stop offset="50%" stop-color="#555"/>
    <stop offset="100%" stop-color="#3d3d3d"/>
  </linearGradient>
</defs>
