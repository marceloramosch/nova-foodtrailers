<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 103 87" width="103" height="87">
  <!-- Gozney Arc XL Pizza Oven — TOP VIEW -->
  <!-- 24.8"D × 20.9"W | Scale: 50px = 1ft -->
  <!-- Outer body -->
  <rect x="1" y="1" width="101" height="85" rx="12" fill="#F97316" fill-opacity="0.15" stroke="#EA580C" stroke-width="2"/>
  <!-- Dome outline (oval from top) -->
  <ellipse cx="51.5" cy="43.5" rx="42" ry="34" fill="#F97316" fill-opacity="0.1" stroke="#EA580C" stroke-width="1.5"/>
  <!-- Opening / mouth -->
  <rect x="0" y="28" width="6" height="32" rx="2" fill="#F97316" fill-opacity="0.3" stroke="#EA580C" stroke-width="1.5"/>
  <!-- Cooking surface circle -->
  <circle cx="51.5" cy="43.5" r="28" fill="none" stroke="#C2410C" stroke-width="0.8" stroke-dasharray="4 3"/>
  <!-- Label -->
  <text x="51.5" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#9A3412">GOZNEY</text>
  <text x="51.5" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="#9A3412">ARC XL</text>
  <!-- Dimensions -->
  <text x="51.5" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#9A3412">20.9" × 24.8"</text>
</svg>