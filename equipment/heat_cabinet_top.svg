<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 95" width="132" height="95">
  <!-- Heat Cabinet (Main Street CHP-1836U) — TOP VIEW -->
  <!-- 31.8"D × 22.7"W | Scale: 50px = 1ft -->
  <!-- Outer body -->
  <rect x="1" y="1" width="130" height="93" rx="3" fill="#8B5CF6" fill-opacity="0.15" stroke="#7C3AED" stroke-width="2"/>
  <!-- Top surface -->
  <rect x="6" y="6" width="120" height="83" rx="2" fill="#8B5CF6" fill-opacity="0.08" stroke="#7C3AED" stroke-width="0.8"/>
  <!-- Vent slots -->
  <rect x="30" y="20" width="72" height="4" rx="1" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="0.5"/>
  <rect x="30" y="30" width="72" height="4" rx="1" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="0.5"/>
  <rect x="30" y="40" width="72" height="4" rx="1" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="0.5"/>
  <rect x="30" y="50" width="72" height="4" rx="1" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="0.5"/>
  <rect x="30" y="60" width="72" height="4" rx="1" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="0.5"/>
  <!-- Door handle indicator -->
  <rect x="10" y="35" width="12" height="24" rx="3" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-width="1"/>
  <!-- Labels -->
  <text x="66" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#5B21B6">HEAT CABINET</text>
  <text x="66" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#5B21B6">22.7" × 31.8"</text>
</svg>