<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 65 200" width="65" height="200">
  <!-- Freidora 40lb (Pitco SG14-S) — SIDE VIEW -->
  <!-- 15.6"W × 46.1"H | Scale: 50px = 1ft -->
  <!-- Cabinet/stand legs -->
  <rect x="5" y="160" width="8" height="36" rx="1" fill="#999999" stroke="#666666" stroke-width="1"/>
  <rect x="52" y="160" width="8" height="36" rx="1" fill="#999999" stroke="#666666" stroke-width="1"/>
  <!-- Cross brace -->
  <rect x="5" y="175" width="55" height="3" fill="#AAAAAA" stroke="#666666" stroke-width="0.8"/>
  <!-- Cabinet body -->
  <rect x="2" y="60" width="61" height="100" rx="3" fill="#EF4444" fill-opacity="0.15" stroke="#DC2626" stroke-width="2"/>
  <!-- Fry pot area -->
  <rect x="7" y="62" width="51" height="50" rx="2" fill="#EF4444" fill-opacity="0.12" stroke="#DC2626" stroke-width="1.2"/>
  <!-- Oil level -->
  <rect x="10" y="80" width="45" height="28" rx="2" fill="#FCA5A5" fill-opacity="0.3" stroke="none"/>
  <!-- Basket handle -->
  <rect x="25" y="50" width="15" height="14" rx="2" fill="none" stroke="#DC2626" stroke-width="1.5"/>
  <!-- Control panel -->
  <rect x="7" y="118" width="51" height="22" rx="2" fill="#F5F5F5" stroke="#999999" stroke-width="1"/>
  <!-- Knobs -->
  <circle cx="20" cy="129" r="4" fill="#DDDDDD" stroke="#999999" stroke-width="1"/>
  <circle cx="45" cy="129" r="4" fill="#DDDDDD" stroke="#999999" stroke-width="1"/>
  <!-- Gas connection -->
  <rect x="25" y="145" width="15" height="10" rx="2" fill="#EEEEEE" stroke="#999999" stroke-width="0.8"/>
  <!-- Floor line -->
  <line x1="0" y1="196" x2="65" y2="196" stroke="#999999" stroke-width="0.5" stroke-dasharray="3 2"/>
  <!-- Labels -->
  <text x="32.5" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#991B1B">FREIDORA</text>
  <text x="32.5" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#991B1B">40lb</text>
  <!-- Dimensions -->
  <text x="32.5" y="10" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#991B1B">15.6"W × 46.1"H</text>
</svg>