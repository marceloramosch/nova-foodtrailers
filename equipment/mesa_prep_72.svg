<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <!-- Mesa de Preparación Grande / Prep Table 72"×30" (6'×2.5') — Scale: 40px=1ft -->
  <rect x="0" y="0" width="240" height="100" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="40" y1="0" x2="40" y2="100" stroke="#8b5cf6" stroke-width="0.3" stroke-dasharray="4,4"/>
  <line x1="80" y1="0" x2="80" y2="100" stroke="#8b5cf6" stroke-width="0.3" stroke-dasharray="4,4"/>
  <line x1="120" y1="0" x2="120" y2="100" stroke="#8b5cf6" stroke-width="0.3" stroke-dasharray="4,4"/>
  <line x1="160" y1="0" x2="160" y2="100" stroke="#8b5cf6" stroke-width="0.3" stroke-dasharray="4,4"/>
  <line x1="200" y1="0" x2="200" y2="100" stroke="#8b5cf6" stroke-width="0.3" stroke-dasharray="4,4"/>
  <text x="120" y="45" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#6d28d9">MESA PREP GRANDE</text>
  <text x="120" y="60" text-anchor="middle" font-family="Arial" font-size="8" fill="#6d28d9">72" × 30"</text>
</svg>