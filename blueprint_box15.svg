<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1200" width="1500" height="1200" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <!-- 1 foot = 40px grid -->
    <pattern id="grid1ft" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d0d8e8" stroke-width="0.5"/>
    </pattern>
    <!-- Dimension arrow markers -->
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e63946"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#e63946"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1500" height="1200" fill="#f8fafc"/>

  <!-- Title -->
  <text x="750" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">BOX 15 FT — BLUEPRINT</text>
  <text x="750" y="55" text-anchor="middle" font-size="12" fill="#6b7280">Interior: 15' × 7'6" × 6'8" · Escala: 1 cuadro = 1 pie · Solo caja</text>

  <!-- ============================================ -->
  <!-- TOP VIEW (PLANTA) — 15' x 7.5' = 600 x 300px -->
  <!-- ============================================ -->
  <g transform="translate(80, 90)">
    <text x="300" y="-8" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">TOP VIEW (PLANTA)</text>

    <!-- Grid background -->
    <rect x="0" y="0" width="600" height="300" fill="#fffde7" stroke="none"/>
    <rect x="0" y="0" width="600" height="300" fill="url(#grid1ft)"/>

    <!-- Box outline -->
    <rect x="0" y="0" width="600" height="300" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>

    <!-- Roll-up door (rear = left side in top view) -->
    <rect x="-3" y="30" width="6" height="240" fill="#f4a261" stroke="#e76f51" stroke-width="1.5" rx="2"/>
    <text x="-14" y="155" text-anchor="middle" font-size="8" fill="#e76f51" transform="rotate(-90,-14,155)">ROLL-UP DOOR</text>

    <!-- Optional side door (right side wall) -->
    <rect x="360" y="297" width="120" height="6" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="420" y="318" text-anchor="middle" font-size="8" fill="#2563eb">SIDE DOOR (opt.)</text>

    <!-- Optional service windows (left wall = top in this view) -->
    <rect x="200" y="-3" width="80" height="6" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="240" y="-10" text-anchor="middle" font-size="8" fill="#2563eb">WINDOW (opt.)</text>
    <rect x="360" y="-3" width="80" height="6" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="400" y="-10" text-anchor="middle" font-size="8" fill="#2563eb">WINDOW (opt.)</text>

    <!-- Front wall (right side = front, toward cab) -->
    <line x1="600" y1="0" x2="600" y2="300" stroke="#1a1a2e" stroke-width="3"/>

    <!-- Optional pass-through -->
    <rect x="597" y="100" width="6" height="100" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="618" y="155" text-anchor="start" font-size="8" fill="#2563eb">PASS-THRU (opt.)</text>

    <!-- Wheel well intrusions (bottom wall, near front) -->
    <rect x="460" y="274" width="60" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="490" y="290" text-anchor="middle" font-size="7" fill="#64748b">WHEEL</text>
    <rect x="460" y="0" width="60" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" rx="4"/>
    <text x="490" y="16" text-anchor="middle" font-size="7" fill="#64748b">WHEEL</text>

    <!-- Foot markers along length (bottom) -->
    <g font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="0" y="330">0'</text>
      <text x="40" y="330">1'</text>
      <text x="80" y="330">2'</text>
      <text x="120" y="330">3'</text>
      <text x="160" y="330">4'</text>
      <text x="200" y="330">5'</text>
      <text x="240" y="330">6'</text>
      <text x="280" y="330">7'</text>
      <text x="320" y="330">8'</text>
      <text x="360" y="330">9'</text>
      <text x="400" y="330">10'</text>
      <text x="440" y="330">11'</text>
      <text x="480" y="330">12'</text>
      <text x="520" y="330">13'</text>
      <text x="560" y="330">14'</text>
      <text x="600" y="330">15'</text>
    </g>

    <!-- Foot markers along width (left side) -->
    <g font-size="9" fill="#94a3b8" text-anchor="end">
      <text x="-8" y="4">0'</text>
      <text x="-8" y="44">1'</text>
      <text x="-8" y="84">2'</text>
      <text x="-8" y="124">3'</text>
      <text x="-8" y="164">4'</text>
      <text x="-8" y="204">5'</text>
      <text x="-8" y="244">6'</text>
      <text x="-8" y="284">7'</text>
      <text x="-8" y="304">7.5'</text>
    </g>

    <!-- Dimension: length -->
    <line x1="0" y1="350" x2="600" y2="350" stroke="#e63946" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
    <text x="300" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#e63946">15' 0" (4.57m)</text>

    <!-- Dimension: width -->
    <line x1="630" y1="0" x2="630" y2="300" stroke="#e63946" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
    <text x="645" y="155" text-anchor="start" font-size="11" font-weight="600" fill="#e63946" transform="rotate(90,645,155)">7' 6" (2.29m)</text>

    <!-- Labels -->
    <text x="15" y="155" font-size="9" fill="#64748b" transform="rotate(-90,15,155)">← REAR</text>
    <text x="585" y="155" font-size="9" fill="#64748b" transform="rotate(-90,585,155)">FRONT (CAB) →</text>
  </g>

  <!-- ============================================ -->
  <!-- LEFT SIDE VIEW — 15' x 6.67' = 600 x 267px -->
  <!-- ============================================ -->
  <g transform="translate(80, 530)">
    <text x="300" y="-8" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">LEFT SIDE VIEW (LADO IZQUIERDO)</text>

    <!-- Grid background -->
    <rect x="0" y="0" width="600" height="267" fill="#fffde7" stroke="none"/>
    <rect x="0" y="0" width="600" height="267" fill="url(#grid1ft)"/>

    <!-- Box outline -->
    <rect x="0" y="0" width="600" height="267" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>

    <!-- Service windows (optional) -->
    <rect x="200" y="40" width="80" height="60" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" rx="3"/>
    <text x="240" y="75" text-anchor="middle" font-size="8" fill="#2563eb">SERVICE</text>
    <text x="240" y="85" text-anchor="middle" font-size="8" fill="#2563eb">WINDOW</text>

    <rect x="360" y="40" width="80" height="60" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" rx="3"/>
    <text x="400" y="75" text-anchor="middle" font-size="8" fill="#2563eb">SERVICE</text>
    <text x="400" y="85" text-anchor="middle" font-size="8" fill="#2563eb">WINDOW</text>

    <!-- Wheels -->
    <ellipse cx="460" cy="280" rx="28" ry="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="460" cy="280" rx="12" ry="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="520" cy="280" rx="28" ry="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="520" cy="280" rx="12" ry="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

    <!-- Ground line -->
    <line x1="-20" y1="308" x2="650" y2="308" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- Foot markers along length -->
    <g font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="0" y="325">0'</text>
      <text x="120" y="325">3'</text>
      <text x="240" y="325">6'</text>
      <text x="360" y="325">9'</text>
      <text x="480" y="325">12'</text>
      <text x="600" y="325">15'</text>
    </g>

    <!-- Height markers -->
    <g font-size="9" fill="#94a3b8" text-anchor="end">
      <text x="-8" y="4">0'</text>
      <text x="-8" y="44">1'</text>
      <text x="-8" y="84">2'</text>
      <text x="-8" y="124">3'</text>
      <text x="-8" y="164">4'</text>
      <text x="-8" y="204">5'</text>
      <text x="-8" y="244">6'</text>
      <text x="-8" y="271">6'8"</text>
    </g>

    <!-- Dimension: length -->
    <line x1="0" y1="340" x2="600" y2="340" stroke="#e63946" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
    <text x="300" y="355" text-anchor="middle" font-size="11" font-weight="600" fill="#e63946">15' 0"</text>

    <!-- Dimension: height -->
    <line x1="630" y1="0" x2="630" y2="267" stroke="#e63946" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
    <text x="645" y="138" text-anchor="start" font-size="11" font-weight="600" fill="#e63946" transform="rotate(90,645,138)">6' 8"</text>

    <!-- Labels -->
    <text x="15" y="260" font-size="9" fill="#64748b">← REAR</text>
    <text x="555" y="260" font-size="9" fill="#64748b">FRONT →</text>
  </g>

  <!-- ============================================ -->
  <!-- RIGHT SIDE VIEW — 15' x 6.67' = 600 x 267px -->
  <!-- ============================================ -->
  <g transform="translate(80, 920)">
    <text x="300" y="-8" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">RIGHT SIDE VIEW (LADO DERECHO)</text>

    <!-- Grid background -->
    <rect x="0" y="0" width="600" height="267" fill="#fffde7" stroke="none"/>
    <rect x="0" y="0" width="600" height="267" fill="url(#grid1ft)"/>

    <!-- Box outline -->
    <rect x="0" y="0" width="600" height="267" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>

    <!-- Side door (optional) -->
    <rect x="360" y="47" width="120" height="220" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" rx="3"/>
    <text x="420" y="160" text-anchor="middle" font-size="9" fill="#2563eb">SIDE DOOR</text>
    <text x="420" y="172" text-anchor="middle" font-size="8" fill="#2563eb">(opt.)</text>

    <!-- Windows (optional) -->
    <rect x="160" y="40" width="80" height="60" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" rx="3"/>
    <text x="200" y="75" text-anchor="middle" font-size="8" fill="#2563eb">WINDOW</text>

    <!-- Wheels -->
    <ellipse cx="80" cy="280" rx="28" ry="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="80" cy="280" rx="12" ry="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="140" cy="280" rx="28" ry="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="140" cy="280" rx="12" ry="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

    <!-- Ground line -->
    <line x1="-20" y1="308" x2="650" y2="308" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- Foot markers -->
    <g font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="0" y="325">0'</text>
      <text x="120" y="325">3'</text>
      <text x="240" y="325">6'</text>
      <text x="360" y="325">9'</text>
      <text x="480" y="325">12'</text>
      <text x="600" y="325">15'</text>
    </g>

    <!-- Labels -->
    <text x="15" y="260" font-size="9" fill="#64748b">← FRONT</text>
    <text x="560" y="260" font-size="9" fill="#64748b">REAR →</text>
  </g>

  <!-- ============================================ -->
  <!-- REAR VIEW — 7.5' x 6.67' = 300 x 267px -->
  <!-- ============================================ -->
  <g transform="translate(800, 90)">
    <text x="150" y="-8" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">REAR VIEW (TRASERA)</text>

    <!-- Grid background -->
    <rect x="0" y="0" width="300" height="267" fill="#fffde7" stroke="none"/>
    <rect x="0" y="0" width="300" height="267" fill="url(#grid1ft)"/>

    <!-- Box outline -->
    <rect x="0" y="0" width="300" height="267" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>

    <!-- Roll-up door opening -->
    <rect x="15" y="15" width="270" height="237" fill="none" stroke="#f4a261" stroke-width="2" rx="3"/>
    <text x="150" y="140" text-anchor="middle" font-size="11" fill="#e76f51">ROLL-UP DOOR</text>
    <text x="150" y="155" text-anchor="middle" font-size="9" fill="#e76f51">OPENING</text>

    <!-- Door dimension -->
    <line x1="15" y1="268" x2="285" y2="268" stroke="#e63946" stroke-width="1" marker-start="url(#arr2)" marker-end="url(#arr)"/>
    <text x="150" y="282" text-anchor="middle" font-size="10" fill="#e63946">6' 2"</text>

    <!-- Foot markers width -->
    <g font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="0" y="305">0'</text>
      <text x="80" y="305">2'</text>
      <text x="160" y="305">4'</text>
      <text x="240" y="305">6'</text>
      <text x="300" y="305">7.5'</text>
    </g>

    <!-- Height markers -->
    <g font-size="9" fill="#94a3b8" text-anchor="end">
      <text x="-8" y="4">0'</text>
      <text x="-8" y="84">2'</text>
      <text x="-8" y="164">4'</text>
      <text x="-8" y="244">6'</text>
      <text x="-8" y="271">6'8"</text>
    </g>

    <!-- Dimension: width -->
    <line x1="0" y1="320" x2="300" y2="320" stroke="#e63946" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
    <text x="150" y="336" text-anchor="middle" font-size="11" font-weight="600" fill="#e63946">7' 6"</text>

    <!-- Dimension: height -->
    <line x1="330" y1="0" x2="330" y2="267" stroke="#e63946" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
    <text x="345" y="138" text-anchor="start" font-size="11" font-weight="600" fill="#e63946" transform="rotate(90,345,138)">6' 8"</text>
  </g>

  <!-- ============================================ -->
  <!-- FRONT VIEW — 7.5' x 6.67' = 300 x 267px -->
  <!-- ============================================ -->
  <g transform="translate(800, 530)">
    <text x="150" y="-8" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">FRONT VIEW (FRENTE DE CAJA)</text>

    <!-- Grid background -->
    <rect x="0" y="0" width="300" height="267" fill="#fffde7" stroke="none"/>
    <rect x="0" y="0" width="300" height="267" fill="url(#grid1ft)"/>

    <!-- Box outline -->
    <rect x="0" y="0" width="300" height="267" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>

    <!-- Front wall label -->
    <text x="150" y="50" text-anchor="middle" font-size="10" fill="#64748b">FRONT WALL</text>

    <!-- Pass-through to cab (optional) -->
    <rect x="100" y="80" width="100" height="100" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6,3" rx="3"/>
    <text x="150" y="130" text-anchor="middle" font-size="8" fill="#2563eb">PASS-THROUGH</text>
    <text x="150" y="142" text-anchor="middle" font-size="8" fill="#2563eb">TO CAB (opt.)</text>
    <text x="150" y="155" text-anchor="middle" font-size="7" fill="#2563eb">2'6" × 2'6"</text>

    <!-- Foot markers width -->
    <g font-size="9" fill="#94a3b8" text-anchor="middle">
      <text x="0" y="305">0'</text>
      <text x="80" y="305">2'</text>
      <text x="160" y="305">4'</text>
      <text x="240" y="305">6'</text>
      <text x="300" y="305">7.5'</text>
    </g>

    <!-- Height markers -->
    <g font-size="9" fill="#94a3b8" text-anchor="end">
      <text x="-8" y="4">0'</text>
      <text x="-8" y="84">2'</text>
      <text x="-8" y="164">4'</text>
      <text x="-8" y="244">6'</text>
      <text x="-8" y="271">6'8"</text>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- LEGEND -->
  <!-- ============================================ -->
  <g transform="translate(1180, 530)">
    <rect x="0" y="0" width="240" height="180" fill="white" stroke="#d0d8e8" stroke-width="1" rx="8"/>
    <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">LEGEND</text>

    <rect x="15" y="40" width="20" height="12" fill="none" stroke="#1a1a2e" stroke-width="2"/>
    <text x="45" y="50" font-size="10" fill="#374151">Box structure</text>

    <rect x="15" y="62" width="20" height="12" fill="none" stroke="#f4a261" stroke-width="2"/>
    <text x="45" y="72" font-size="10" fill="#374151">Door / opening</text>

    <rect x="15" y="84" width="20" height="12" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="45" y="94" font-size="10" fill="#374151">Optional element</text>

    <line x1="15" y1="112" x2="35" y2="112" stroke="#e63946" stroke-width="2" marker-end="url(#arr)"/>
    <text x="45" y="116" font-size="10" fill="#374151">Dimension</text>

    <rect x="15" y="126" width="20" height="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="45" y="136" font-size="10" fill="#374151">Wheel well</text>

    <rect x="15" y="148" width="20" height="12" fill="#fffde7" stroke="#d0d8e8" stroke-width="0.5"/>
    <text x="45" y="158" font-size="10" fill="#374151">1 cuadro = 1 pie</text>
  </g>

  <!-- SPECS BOX -->
  <g transform="translate(1180, 90)">
    <rect x="0" y="0" width="240" height="200" fill="white" stroke="#d0d8e8" stroke-width="1" rx="8"/>
    <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">SPECIFICATIONS</text>
    <line x1="10" y1="32" x2="230" y2="32" stroke="#e5e7eb" stroke-width="1"/>

    <text x="15" y="52" font-size="10" fill="#374151">Interior Length</text>
    <text x="225" y="52" text-anchor="end" font-size="10" font-weight="600" fill="#1a1a2e">15' 0"</text>

    <text x="15" y="70" font-size="10" fill="#374151">Interior Width</text>
    <text x="225" y="70" text-anchor="end" font-size="10" font-weight="600" fill="#1a1a2e">7' 6"</text>

    <text x="15" y="88" font-size="10" fill="#374151">Interior Height</text>
    <text x="225" y="88" text-anchor="end" font-size="10" font-weight="600" fill="#1a1a2e">6' 8"</text>

    <text x="15" y="106" font-size="10" fill="#374151">Floor Area</text>
    <text x="225" y="106" text-anchor="end" font-size="10" font-weight="600" fill="#1a1a2e">112.5 sq ft</text>

    <text x="15" y="124" font-size="10" fill="#374151">Door Opening W</text>
    <text x="225" y="124" text-anchor="end" font-size="10" font-weight="600" fill="#1a1a2e">6' 2"</text>

    <text x="15" y="142" font-size="10" fill="#374151">Door Opening H</text>
    <text x="225" y="142" text-anchor="end" font-size="10" font-weight="600" fill="#1a1a2e">6' 0"</text>

    <text x="15" y="166" font-size="10" fill="#6b7280">Scale</text>
    <text x="225" y="166" text-anchor="end" font-size="10" font-weight="600" fill="#2563eb">1 cuadro = 1 pie</text>

    <text x="15" y="184" font-size="10" fill="#6b7280">Grid</text>
    <text x="225" y="184" text-anchor="end" font-size="10" font-weight="600" fill="#2563eb">40px = 1 ft</text>
  </g>

</svg>
