<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e8ecf2" stroke-width="0.4"/>
    </pattern>
    <marker id="a1" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#DC2626"/>
    </marker>
    <marker id="a2" markerWidth="7" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <path d="M7,0 L0,2.5 L7,5 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="#f8fafc"/>
  <rect width="700" height="420" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="40" fill="#1a1a2e"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#FFFFFF">GOZNEY ARC XL — PIZZA OVEN</text>
  <text x="680" y="26" text-anchor="end" font-size="10" fill="#94A3B8">Scale: 1 sq = 1 in</text>

  <!-- ====== TOP VIEW ====== -->
  <text x="170" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">TOP VIEW</text>

  <!-- Body 20.9" x 24.8" → scaled to show nicely -->
  <g transform="translate(65, 85)">
    <!-- Outer shell -->
    <rect x="0" y="0" width="209" height="248" rx="20" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
    <!-- Dome -->
    <ellipse cx="104.5" cy="124" rx="85" ry="100" fill="#FDBA74" fill-opacity="0.2" stroke="#EA580C" stroke-width="1.5"/>
    <!-- Cooking surface -->
    <circle cx="104.5" cy="124" r="70" fill="none" stroke="#C2410C" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="104.5" y="120" text-anchor="middle" font-size="9" fill="#9A3412">COOKING</text>
    <text x="104.5" y="132" text-anchor="middle" font-size="9" fill="#9A3412">SURFACE</text>
    <!-- Mouth opening -->
    <rect x="-4" y="82" width="10" height="84" rx="3" fill="#FB923C" fill-opacity="0.4" stroke="#EA580C" stroke-width="1.5"/>
    <text x="-18" y="128" text-anchor="middle" font-size="7" fill="#EA580C" transform="rotate(-90,-18,128)">OPENING</text>

    <!-- Dimension: width -->
    <line x1="0" y1="272" x2="209" y2="272" stroke="#DC2626" stroke-width="1.2" marker-start="url(#a2)" marker-end="url(#a1)"/>
    <text x="104.5" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626">20.9"</text>

    <!-- Dimension: depth -->
    <line x1="232" y1="0" x2="232" y2="248" stroke="#DC2626" stroke-width="1.2" marker-start="url(#a2)" marker-end="url(#a1)"/>
    <text x="250" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626" transform="rotate(90,250,128)">24.8"</text>
  </g>

  <!-- ====== SIDE VIEW ====== -->
  <text x="510" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">SIDE VIEW</text>

  <g transform="translate(390, 85)">
    <!-- Base -->
    <rect x="0" y="100" width="240" height="55" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
    <!-- Dome arch -->
    <path d="M 15,100 Q 15,10 120,10 Q 225,10 225,100" fill="#FDBA74" fill-opacity="0.15" stroke="#EA580C" stroke-width="2.5"/>
    <!-- Opening -->
    <rect x="-4" y="55" width="14" height="65" rx="3" fill="#FB923C" fill-opacity="0.4" stroke="#EA580C" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="165" y="2" width="18" height="18" rx="3" fill="#F97316" fill-opacity="0.3" stroke="#EA580C" stroke-width="1.5"/>
    <!-- Internal flame area -->
    <path d="M 40,100 Q 40,40 120,40 Q 200,40 200,100" fill="none" stroke="#C2410C" stroke-width="0.8" stroke-dasharray="4 3"/>
    <!-- Counter line -->
    <line x1="-10" y1="155" x2="250" y2="155" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="248" y="152" text-anchor="end" font-size="7" fill="#94A3B8">COUNTER</text>

    <!-- Dimension: depth -->
    <line x1="0" y1="178" x2="240" y2="178" stroke="#DC2626" stroke-width="1.2" marker-start="url(#a2)" marker-end="url(#a1)"/>
    <text x="120" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626">24.8"</text>

    <!-- Dimension: height -->
    <line x1="260" y1="10" x2="260" y2="155" stroke="#DC2626" stroke-width="1.2" marker-start="url(#a2)" marker-end="url(#a1)"/>
    <text x="278" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626" transform="rotate(90,278,86)">13.5"</text>
  </g>

  <!-- ====== SPECS BOX ====== -->
  <rect x="20" y="360" width="660" height="45" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="35" y="380" font-size="10" font-weight="700" fill="#1a1a2e">SPECS:</text>
  <text x="90" y="380" font-size="10" fill="#374151">Type: Gas Pizza Oven</text>
  <text x="230" y="380" font-size="10" fill="#374151">Fuel: Propane/Wood</text>
  <text x="390" y="380" font-size="10" fill="#374151">Max Pizza: 16"</text>
  <text x="530" y="380" font-size="10" fill="#374151">Weight: 58.5 lbs</text>
  <text x="35" y="397" font-size="10" fill="#374151">Dimensions: 20.9"W × 24.8"D × 13.5"H</text>
  <text x="320" y="397" font-size="10" fill="#374151">Cooking Surface: 338.5 sq in</text>
  <text x="560" y="397" font-size="9" fill="#0D2244" font-weight="700">NOVA FOOD TRAILERS</text>
</svg>