  <text x="688" y="556" font-size="11" fill="#555">Floor</text>
  <text x="1162" y="556" text-anchor="end" font-size="11" font-weight="700" fill="#0D2244">Diamond-plate aluminum</text>

  <!-- VEHICLE / CHASSIS -->
  <rect x="670" y="586" width="510" height="155" rx="8" fill="#FFF" stroke="#D1D5DB" stroke-width="1.5"/>
