  <text x="688" y="658" font-size="11" fill="#555">GVWR</text>
  <text x="1162" y="658" text-anchor="end" font-size="11" font-weight="700" fill="#0D2244">7,000 lbs</text>
  <line x1="688" y1="664" x2="1162" y2="664" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="688" y="680" font-size="11" fill="#555">Hitch</text>
  <text x="1162" y="680" text-anchor="end" font-size="11" font-weight="700" fill="#0D2244">2-5/16" ball coupler</text>
  <line x1="688" y1="686" x2="1162" y2="686" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="688" y="702" font-size="11" fill="#555">Brakes</text>
  <text x="1162" y="702" text-anchor="end" font-size="11" font-weight="700" fill="#0D2244">Electric brakes</text>
  <line x1="688" y1="708" x2="1162" y2="708" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="688" y="724" font-size="11" fill="#555">Tires</text>
  <text x="1162" y="724" text-anchor="end" font-size="11" font-weight="700" fill="#0D2244">ST225/75R15</text>

  <!-- FOOTER -->
  <rect x="0" y="820" width="1200" height="30" fill="#0D2244"/>
  <text x="20" y="839" font-size="10" fill="#94A3B8">Client: Shamin Food Truck · Box 15' × 7'6" × 6'8" · All equipment NSF/ANSI certified</text>
  <text x="1180" y="839" text-anchor="end" font-size="11" font-weight="800" fill="#FFF" letter-spacing="2">NOVA FOOD TRAILERS</text>
