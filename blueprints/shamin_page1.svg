<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8ecf2" stroke-width="0.3"/>
    </pattern>
    <marker id="a1" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#DC2626"/>
    </marker>
    <marker id="a2" markerWidth="7" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <path d="M7,0 L0,2.5 L7,5 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1200" height="850" fill="#f8fafc"/>
  <rect width="1200" height="850" fill="url(#grid)"/>

  <!-- TITLE BAR -->
  <rect x="0" y="0" width="1200" height="48" fill="#0D2244"/>
  <rect x="14" y="10" width="28" height="28" rx="4" fill="none" stroke="#C8D8F0" stroke-width="1.5"/>
  <rect x="19" y="15" width="8" height="8" rx="1" fill="#2D6BC4"/>
  <rect x="29" y="15" width="8" height="8" rx="1" fill="#C8D8F0" fill-opacity="0.4"/>
  <rect x="19" y="25" width="8" height="8" rx="1" fill="#C8D8F0" fill-opacity="0.4"/>
  <rect x="29" y="25" width="8" height="8" rx="1" fill="#2D6BC4"/>
  <text x="52" y="28" font-size="14" font-weight="800" fill="#FFF" letter-spacing="3">NOVA</text>
  <text x="52" y="40" font-size="6.5" fill="#94A3B8" letter-spacing="2">FOOD TRAILERS</text>
  <text x="140" y="30" font-size="16" font-weight="800" fill="#FFF" letter-spacing="1">SHAMIN FOOD TRUCK — BOX 15 FT</text>
  <text x="1186" y="25" text-anchor="end" font-size="10" fill="#94A3B8">PAGE 1 OF 2</text>
  <text x="1186" y="40" text-anchor="end" font-size="9" fill="#64748B">Interior: 15' × 7'6" × 6'8"</text>

  <!-- ============================================================ -->
  <!-- LEFT SIDE VIEW -->
  <!-- ============================================================ -->
  <text x="310" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#0D2244">LEFT SIDE VIEW (LADO IZQUIERDO)</text>

  <g transform="translate(20, 90)">
    <rect x="0" y="0" width="600" height="268" rx="3" fill="#FFFDE7" fill-opacity="0.35" stroke="#333" stroke-width="2.5"/>
    <rect x="6" y="6" width="588" height="256" rx="2" fill="none" stroke="#aaa" stroke-width="0.8"/>

    <!-- Vent hood -->
    <rect x="20" y="10" width="320" height="32" rx="3" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="180" y="30" text-anchor="middle" font-size="9" font-weight="700" fill="#5B21B6">VENT HOOD 8ft — TYPE I NSF/ANSI 2</text>

    <!-- Shelf -->
    <line x1="20" y1="48" x2="340" y2="48" stroke="#888" stroke-width="1"/>
    <line x1="20" y1="52" x2="340" y2="52" stroke="#888" stroke-width="0.5"/>

    <!-- Burners -->
    <ellipse cx="80" cy="120" rx="35" ry="18" fill="none" stroke="#EA580C" stroke-width="1.8"/>
    <ellipse cx="160" cy="120" rx="35" ry="18" fill="none" stroke="#EA580C" stroke-width="1.8"/>
    <ellipse cx="240" cy="120" rx="35" ry="18" fill="none" stroke="#EA580C" stroke-width="1.8"/>

    <!-- Counter -->
    <rect x="20" y="148" width="310" height="6" rx="1" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>

