    <rect x="462" y="70" width="110" height="100" rx="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <rect x="468" y="76" width="30" height="55" rx="2" fill="#BAE6FD" stroke="#0284C7" stroke-width="0.6"/>
    <rect x="502" y="76" width="30" height="55" rx="2" fill="#BAE6FD" stroke="#0284C7" stroke-width="0.6"/>
    <rect x="536" y="76" width="30" height="55" rx="2" fill="#BAE6FD" stroke="#0284C7" stroke-width="0.6"/>
    <text x="517" y="150" text-anchor="middle" font-size="7" font-weight="700" fill="#0369A1">3-COMP SINK</text>
