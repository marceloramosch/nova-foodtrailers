  <text x="1162" y="512" text-anchor="end" font-size="11" font-weight="700" fill="#0D2244">R-13 per inch</text>
  <line x1="688" y1="518" x2="1162" y2="518" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="688" y="534" font-size="11" fill="#555">Interior Finish</text>
