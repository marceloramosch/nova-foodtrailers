    <path d="M88,60 L88,38 L145,38" fill="none" stroke="#DC2626" stroke-width="1" marker-end="url(#a1)"/>
    <path d="M188,60 L188,38 L245,38" fill="none" stroke="#DC2626" stroke-width="1" marker-end="url(#a1)"/>
