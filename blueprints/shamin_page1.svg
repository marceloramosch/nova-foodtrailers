  <!-- ============================================================ -->
  <!-- RIGHT SIDE VIEW -->
  <!-- ============================================================ -->
  <text x="310" y="428" text-anchor="middle" font-size="14" font-weight="800" fill="#0D2244">RIGHT SIDE VIEW (LADO DERECHO)</text>

  <g transform="translate(20, 440)">
    <rect x="0" y="0" width="600" height="268" rx="3" fill="#FFFDE7" fill-opacity="0.35" stroke="#333" stroke-width="2.5"/>
    <rect x="6" y="6" width="588" height="256" rx="2" fill="none" stroke="#aaa" stroke-width="0.8"/>

    <!-- A/C -->
    <rect x="15" y="8" width="35" height="32" rx="3" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.2"/>
    <text x="32" y="27" text-anchor="middle" font-size="8" font-weight="600" fill="#374151">A/C</text>

